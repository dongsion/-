<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>杯套扇形相框</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 28px 18px; color: #2c2a26; background: radial-gradient(circle at 30% 12%, #f7f5ef, #e6e3db); font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif; }
      main { width: min(100%, 760px); }
      h1 { margin: 0 0 6px; font-size: 20px; }
      p { margin: 0 0 18px; font-size: 13px; line-height: 1.6; color: #7a7770; }
      code { padding: 1px 5px; border-radius: 4px; background: rgba(44, 42, 38, .07); font-size: 12px; }
      .frame { border: 12px solid #2c2a26; border-radius: 6px; background: #fffefa; box-shadow: 0 24px 50px rgba(31, 32, 36, .18); }
      .stage { position: relative; width: 100%; aspect-ratio: 4 / 3; overflow: hidden; background: #fffefa; }
      .strip { position: absolute; left: 0; bottom: 0; transform-origin: left bottom; display: flex; align-items: center; justify-content: flex-end; padding-right: 14px; border: 1px solid rgba(60, 55, 48, .35); border-radius: 3px; font-size: 12px; font-weight: 700; letter-spacing: .5px; color: #4b453d; box-shadow: 0 6px 14px rgba(31, 32, 36, .08); }
    </style>
  </head>
  <body>
    <main>
      <h1>杯套扇形相框</h1>
      <p>黑色相框、白色背景。每张杯套 <code>left:0; bottom:0</code>，旋转基点统一为左下角 <code>transform-origin:left bottom</code>，并沿半径方向多层排布。每张按所在扇环裁成扇形格子（<code>clip-path</code>），一圈之内左右边紧贴、环与环之间弧线相接，整框被铺满且互不交叠。</p>
      <div class="frame">
        <div class="stage" id="stage"></div>
      </div>
    </main>
    <script>
      const stage = document.getElementById("stage");
      const W = 4;
      const H = 3;
      const length = 1.2;
      const thick = 0.7;
      const start = -100;
      const end = 10;
      const radiusEnd = 7;
      const span = ((end - start) * Math.PI) / 180;
      function rotatePoint(x, y, deg) { const r = (deg * Math.PI) / 180; const c = Math.cos(r); const s = Math.sin(r); return [x * c - y * s, x * s + y * c]; }
      let index = 0;
      for (let radius = thick / 2; radius <= radiusEnd + 1e-6; radius += thick) {
        const count = Math.max(2, Math.round((radius * span) / length));
        const step = span / count;
        for (let k = 0; k < count; k += 1) {
          const a0 = ((start * Math.PI) / 180) + k * step;
          const rot = ((a0 + step / 2) * 180) / Math.PI + 90;
          const rIn = radius - thick / 2;
          const rOut = radius + thick / 2;
          const seg = Math.max(2, Math.ceil(step / 0.05));
          const points = [];
          for (let i = 0; i <= seg; i += 1) { const a = a0 + (step * i) / seg; points.push([rIn * Math.cos(a), rIn * Math.sin(a)]); }
          for (let i = seg; i >= 0; i -= 1) { const a = a0 + (step * i) / seg; points.push([rOut * Math.cos(a), rOut * Math.sin(a)]); }
          const local = points.map((point) => rotatePoint(point[0], point[1], -rot));
          const minX = Math.min(...local.map((p) => p[0]));
          const maxX = Math.max(...local.map((p) => p[0]));
          const minY = Math.min(...local.map((p) => p[1]));
          const maxY = Math.max(...local.map((p) => p[1]));
          const width = maxX - minX;
          const height = maxY - minY;
          const strip = document.createElement("div");
          strip.className = "strip";
          strip.style.width = `${(width / W) * 100}%`;
          strip.style.height = `${(height / H) * 100}%`;
          strip.style.transformOrigin = "left bottom";
          strip.style.transform = `rotate(${rot}deg) translate(${(minX / width) * 100}%, ${(maxY / height) * 100}%)`;
          strip.style.clipPath = `polygon(${local.map((p) => `${(((p[0] - minX) / width) * 100).toFixed(3)}% ${(((p[1] - minY) / height) * 100).toFixed(3)}%`).join(",")})`;
          strip.style.zIndex = index;
          strip.style.background = `linear-gradient(90deg, hsl(${(index * 24) % 360} 72% 84%), hsl(${(index * 24 + 34) % 360} 70% 66%))`;
          stage.appendChild(strip);
          index += 1;
        }
      }
    </script>
  </body>
</html>
