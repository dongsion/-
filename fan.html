<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>杯套扇形相框</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 28px 18px; color: #2c2a26; background: radial-gradient(circle at 30% 12%, #f7f5ef, #e6e3db); font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif; }
      main { width: min(100%, 760px); }
      h1 { margin: 0 0 6px; font-size: 20px; }
      p { margin: 0 0 18px; font-size: 13px; line-height: 1.6; color: #7a7770; }
      code { padding: 1px 5px; border-radius: 4px; background: rgba(44, 42, 38, .07); font-size: 12px; }
      .frame { border: 12px solid #2c2a26; border-radius: 6px; background: #fffefa; box-shadow: 0 24px 50px rgba(31, 32, 36, .18); }
      .stage { position: relative; width: 100%; aspect-ratio: 4 / 3; overflow: hidden; background: #fffefa; }
      .strip { position: absolute; left: 0; bottom: 0; transform-origin: left bottom; display: flex; align-items: center; justify-content: flex-end; padding-right: 14px; border: 1px solid rgba(60, 55, 48, .35); border-radius: 3px; font-size: 12px; font-weight: 700; letter-spacing: .5px; color: #4b453d; box-shadow: 0 6px 14px rgba(31, 32, 36, .08); }
    </style>
  </head>
  <body>
    <main>
      <h1>杯套扇形相框</h1>
      <p>黑色相框、白色背景。每张杯套 <code>left:0; bottom:0</code>，旋转基点统一为左下角 <code>transform-origin:left bottom</code>，只改变 <code>rotate</code>，并沿半径方向多层排布 <code>translate</code>。杯套长边沿扇弧切向贴合，从右上近水平逐渐倾斜到左下最斜，形成贴满整框的扇形结构。</p>
      <div class="frame">
        <div class="stage" id="stage"></div>
      </div>
    </main>
    <script>
      const stage = document.getElementById("stage");
      const W = 4;
      const H = 3;
      const length = 1.2;
      const thick = 0.7;
      const start = -100;
      const end = 10;
      const overlap = 1;
      const radiusStart = thick / 2;
      const radiusEnd = 7;
      const radiusStep = thick;
      const span = ((end - start) * Math.PI) / 180;
      let index = 0;
      let ring = 0;
      for (let radius = radiusStart; radius <= radiusEnd + 1e-6; radius += radiusStep) {
        const count = Math.max(1, Math.round((radius * span) / (length * overlap)));
        const offset = ring % 2 ? 0.5 : 0;
        for (let k = 0; k < count; k += 1) {
          const phi = ((start * Math.PI) / 180) + ((k + offset) / count) * span;
          const rot = (phi * 180) / Math.PI + 90;
          const depth = (-(radius - thick / 2) / thick) * 100;
          const strip = document.createElement("div");
          strip.className = "strip";
          strip.style.width = `${(length / W) * 100}%`;
          strip.style.height = `${(thick / H) * 100}%`;
          strip.style.transformOrigin = "left bottom";
          strip.style.transform = `rotate(${rot}deg) translate(-50%, ${depth}%)`;
          strip.style.zIndex = index;
          strip.style.background = `linear-gradient(90deg, hsl(${(index * 24) % 360} 72% 84%), hsl(${(index * 24 + 34) % 360} 70% 66%))`;
          strip.textContent = `${rot.toFixed(0)}°`;
          stage.appendChild(strip);
          index += 1;
        }
        ring += 1;
      }
    </script>
  </body>
</html>
